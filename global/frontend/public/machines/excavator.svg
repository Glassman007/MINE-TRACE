<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" fill="none">
  <defs>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD84A"/>
      <stop offset="0.55" stop-color="#F7B71E"/>
      <stop offset="1" stop-color="#E2920B"/>
    </linearGradient>
    <linearGradient id="yellowDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8A30E"/>
      <stop offset="1" stop-color="#B96A00"/>
