      <stop offset="1" stop-color="#2E353C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFE8F5" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#6A96A8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#283E49" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

